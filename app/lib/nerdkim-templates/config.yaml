  giftNote: |
    참석이 어려우신 분들을 위해 기재했습니다.<br />
    전해주시는 따뜻한 마음, 소중히 간직하겠습니다.
  blessNote: |
    버튼 한 번이면 충분해요.<br />
    저희에게 큰 힘이 됩니다.
  blessHint: "입력하지 않으시면 랜덤한 축하 메세지가 발송됩니다."
  blessPlaceholder: "축하 한마디 (선택, 최대 50자)"
  footerThanks: "저희 두 사람을 축복해 주셔서 감사합니다"
  footerNote: |
    신랑과 신부 모두 개발자로 일하고 있어, 저희다운 방식으로 결혼을 기념하고자 개발자 버전 청첩장을 만들어 보았습니다.<br />
    신랑이 개발과 배포를, 신부가 기획과 QA를 맡아 함께 완성했습니다.<br />
    재미로 준비한 페이지이니 편하게 둘러봐 주세요!

