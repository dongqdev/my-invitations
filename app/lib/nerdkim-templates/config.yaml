# 청첩장 정적 템플릿(main/developer/terminal)에 박혀 있던 "감성 문구"(인사말,
# 안내 문구, 힌트 텍스트 등)를 여기로 뺐다. `lib/nerdkim/generateInvitation.ts`가
# 이 파일을 읽어 `{{COPY_*}}` 토큰으로 주입한다 — 문구를 바꾸고 싶을 때 90줄이
# 넘는 HTML 템플릿을 뒤질 필요 없이 이 파일만 고치면 된다.
#
# 값 안의 <span class="hl-g">...</span> 같은 인라인 태그는 원본 템플릿의 강조
# 스타일이다 — 지우면 그 부분 색 강조만 사라지고 레이아웃이 깨지진 않는다.
# `\n`을 리터럴로 쓰면 <br />로 바뀐다(다른 필드와 달리 값을 그대로 HTML에
# 꽂으므로, YAML 안에서 실제 줄바꿈 대신 `\n` 두 글자를 쓰고 싶으면 큰따옴표
# 문자열로 감싸야 한다 — 아래 항목들은 모두 실제 줄바꿈으로 문단을 나눴다).
#
# 세 테마(main/developer/terminal) 모두 신랑/신부 이름·날짜·장소처럼 폼에서 받는
# 값은 여기 없다 — 그건 여전히 generateInvitation.ts가 직접 계산한다. 이 파일은
# "폼과 무관하게 모든 청첩장에 공통으로 뜨는 고정 문구"만 담는다.

